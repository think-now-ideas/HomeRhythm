# Legt automatisch ein GitHub-Release an, sobald eine neue Version (manifest.json „version“) auf main landet.
# HACS zeigt dann echte Versionsnummern als Update an. Die Version muss in manifest.json, const.py und der Karte gleich sein.
name: Release

on:
  push:
    branches: [main]
    paths: ["custom_components/home_rhythm/manifest.json"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Version lesen und prüfen
        id: v
        run: |
          D=custom_components/home_rhythm
          V=$(python3 -c "import json;print(json.load(open('$D/manifest.json'))['version'])")
          C=$(grep -oP '^VERSION = "\K[^"]+' $D/const.py)
          J=$(grep -oP 'const VERSION = "\K[^"]+' $D/www/home-rhythm-card.js)
          echo "manifest=$V const=$C karte=$J"
          echo "$V" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?$' || { echo "Version $V hat nicht das Format A.B.C oder A.B.C.D"; exit 1; }
          [ "$V" = "$C" ] && [ "$V" = "$J" ] || { echo "Versionen passen nicht zusammen"; exit 1; }
          grep -qE "^## $(echo "$V" | sed 's/\./\\./g')( |$)" CHANGELOG.md || { echo "CHANGELOG.md hat keinen Abschnitt ## $V"; exit 1; }
          echo "version=$V" >> "$GITHUB_OUTPUT"
      - name: Release anlegen, falls es diese Version noch nicht gibt
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          if gh release view "v$VERSION" >/dev/null 2>&1; then echo "v$VERSION gibt es schon"; exit 0; fi
          NOTES=$(awk -v v="$VERSION" '$0 ~ "^## " && ($2 == v) {f=1; next} /^## / && f {exit} f' CHANGELOG.md)
          gh release create "v$VERSION" --target "$GITHUB_SHA" --title "Home Rhythm $VERSION" --notes "${NOTES:-Siehe CHANGELOG.md}"
